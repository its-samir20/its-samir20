<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#38BDF8;#F472B6;#34D399;#FBBF24;#818CF8;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%">
        <animate attributeName="stop-color" values="#818CF8;#38BDF8;#F472B6;#34D399;#FBBF24;#818CF8" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#FBBF24;#818CF8;#38BDF8;#F472B6;#34D399;#FBBF24" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%">
        <animate attributeName="stop-color" values="#38BDF8;#F472B6;#34D399;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color" values="#F472B6;#34D399;#38BDF8;#F472B6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="#0F172A" rx="24"/>
  <rect x="150" y="20" width="600" height="8" rx="4" fill="url(#barGrad)"/>
  <text x="50%" y="48%" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="76" font-weight="bold" fill="url(#textGrad)">S A M I R</text>
  <text x="50%" y="68%" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="26" fill="#94A3B8">Code. Create. Repeat.</text>
  <rect x="150" y="252" width="600" height="8" rx="4" fill="url(#barGrad)"/>
</svg>
